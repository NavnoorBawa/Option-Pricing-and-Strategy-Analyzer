[theme]
base = "dark"
primaryColor = "#FF4B4B"

[server]
# Uploaded option-quote CSVs are small; cap uploads at 10 MB.
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# Hide developer menu items from viewers and show only the error type (no stack traces) to users.
toolbarMode = "viewer"
showErrorDetails = "type"
