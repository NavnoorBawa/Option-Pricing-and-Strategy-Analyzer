[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "options-analyzer"
dynamic = ["version"]
description = "Option pricing, Greeks, multi-leg strategy analytics, VaR/stress testing and volatility surfaces, with a Streamlit UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navnoor Bawa" }]
requires-python = ">=3.10"
# The numerical core needs only NumPy, SciPy and pandas; the Streamlit app is the "app" extra.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]
keywords = ["options", "black-scholes", "greeks", "binomial", "monte-carlo", "value-at-risk", "local-volatility", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
app = [
    "plotly>=5.24",
    "streamlit>=1.64,<2",
    "xlsxwriter>=3.1",
]

[project.scripts]
options-analyzer = "options_analyzer.ui.launch:main"

[project.urls]
Repository = "https://github.com/NavnoorBawa/Option-Pricing-and-Strategy-Analyzer"
Issues = "https://github.com/NavnoorBawa/Option-Pricing-and-Strategy-Analyzer/issues"

[tool.setuptools.dynamic]
version = { attr = "options_analyzer.__version__" }

[tool.setuptools.packages.find]
include = ["options_analyzer*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF", "C4", "PIE"]
# Greek letters (σ, Δ, ν, ...) in strings and comments are intentional.
ignore = ["RUF001", "RUF002", "RUF003", "C408"]

[tool.ruff.lint.per-file-ignores]
# Long display-math LaTeX lines cannot be wrapped.
"options_analyzer/ui/tab_methodology.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the checkout (also for the plain `pytest` console script).
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
