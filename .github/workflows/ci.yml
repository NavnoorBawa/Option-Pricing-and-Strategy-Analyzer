name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hypothesis: 300 examples per property from a fixed seed, without an example database (tests/conftest.py).
  HYPOTHESIS_PROFILE: ci
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        # The font-metric tests skip when fontTools or brotli does not import; here that stops the job instead.
        run: |
          pip install -r requirements-dev.txt
          python -c "import brotli, fontTools.ttLib"
      - name: Run tests
        # One worker per CPU; --dist loadfile keeps each test file (and its Streamlit AppTests) on one worker.
        # Network canaries and browser tests run in their own workflows.
        run: pytest -n auto --dist loadfile -q -m "not network and not e2e"

  # The oldest dependency versions the project declares on the oldest Python it supports, so that the lower bounds
  # stay true together (Streamlit 1.65 is the last release for Python 3.10; NumPy 1.26 has no wheels past 3.12).
  oldest-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the declared minimum versions
        # The test tools come from requirements-dev.txt (the one place they are pinned); the constraints hold each
        # runtime dependency at its lower bound.
        run: |
          printf '%s\n' "numpy==1.26.*" "pandas==2.1.*" "scipy==1.11.*" "plotly==5.24.*" "streamlit==1.65.*" \
            "xlsxwriter==3.1.*" > "$RUNNER_TEMP/oldest.txt"
          pip install -r requirements-dev.txt -c "$RUNNER_TEMP/oldest.txt"
          python -c "import brotli, fontTools.ttLib"
          pip list
      - name: Run tests
        run: pytest -n auto --dist loadfile -q -m "not network and not e2e"

  # Cross-checks against independent libraries (QuantLib, Let's Be Rational), which are test-only dependencies.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # An oracle library that does not import stops the run, and an oracle test that would be skipped fails
      # (tests/conftest.py), so that this job cannot pass with no oracle check run.
      REQUIRE_ORACLES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the dev tools and the oracles
        run: pip install -r requirements-oracle.txt
      - name: Run the oracle tests
        run: pytest -n auto --dist loadfile -q -m oracle

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Install the numerical core alone, import every core module and run the core tests
        # `pip install .` promises a core that needs only NumPy, SciPy and pandas: a stray Streamlit or Plotly import
        # outside options_analyzer/ui would break it. The test tools come from requirements-dev.txt without its
        # `-r requirements.txt` (which would bring the app); pythonpath is emptied so the tests import the wheel.
        run: |
          python -m venv "$RUNNER_TEMP/core"
          . "$RUNNER_TEMP/core/bin/activate"
          pip install "$(ls dist/*.whl)"
          grep -v '^-r' requirements-dev.txt > "$RUNNER_TEMP/tools.txt"
          pip install -r "$RUNNER_TEMP/tools.txt"
          cd "$RUNNER_TEMP"
          python - <<'EOF'
          import importlib, pkgutil, sys, options_analyzer
          core = [m.name for m in pkgutil.walk_packages(options_analyzer.__path__, "options_analyzer.")
                  if not m.name.startswith("options_analyzer.ui")]
          for name in core:
              importlib.import_module(name)
          assert not {"streamlit", "plotly", "xlsxwriter"} & set(sys.modules), "the core imported the app's libraries"
          print(f"imported {len(core)} core modules from {options_analyzer.__file__} without the app extra")
          EOF
          cd "$GITHUB_WORKSPACE"
          pytest -n auto -q -o pythonpath= tests/test_black_scholes.py tests/test_american.py tests/test_implied_vol.py \
            tests/test_strategies.py tests/test_risk.py
      - name: Install the wheel with the app extra
        run: pip install "$(ls dist/*.whl)[app]"
      - name: Check that the wheel ships every file of the package
        # Fonts, stylesheets and Methodology text are package data; a missing glob would drop them silently.
        run: |
          python - <<'EOF'
          import pathlib, subprocess, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          shipped = set(zipfile.ZipFile(wheel).namelist())
          tracked = subprocess.run(["git", "ls-files", "options_analyzer"], capture_output=True, text=True, check=True)
          missing = [path for path in tracked.stdout.splitlines() if path not in shipped]
          assert not missing, f"{wheel.name} lacks {missing}"
          print(f"{wheel.name} ships all {len(tracked.stdout.splitlines())} tracked package files")
          EOF
      - name: Import the core and the app outside the checkout
        working-directory: /tmp
        run: |
          python -c "import options_analyzer, options_analyzer.ui.app; print(options_analyzer.__version__)"
          python -c "import pathlib, options_analyzer.ui as ui; assert (pathlib.Path(ui.__file__).parent / '.streamlit' / 'config.toml').is_file()"
          command -v options-analyzer
